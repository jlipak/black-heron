[project]
name = "black-heron"
version = "1.4.0"
description = "Repository audit with four Claude lenses, an adversarial verifier and SARIF, JSON and Markdown output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Josip Lipak" }]
requires-python = ">=3.11"
keywords = ["code-audit", "code-review", "claude", "llm", "sarif", "mcp", "governance", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "anthropic>=0.40",
    "rich>=13",
    "pydantic>=2",
    "click>=8",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3", "ruff>=0.5"]

[project.scripts]
black-heron = "black_heron.cli:audit"

[project.urls]
Homepage = "https://github.com/jlipak/black-heron"
Repository = "https://github.com/jlipak/black-heron"
Changelog = "https://github.com/jlipak/black-heron/blob/master/CHANGELOG.md"
Issues = "https://github.com/jlipak/black-heron/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
black_heron = ["rubric.default.json", "mcp_consumers/mcp.default.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
