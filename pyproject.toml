[project]
name = "black-heron"
version = "1.3.1"
description = "Governance-first 4-lens repository audit agent with adversarial Opus verifier, code-writing suggest mode, parallel lens execution, external MCP enrichment (context7/sequential-thinking/firecrawl/playwright), baseline drift-over-time mode (--baseline), evidence pre-check, versioned rubric, SARIF output, MCP server, BLOCK-level hooks, sub-agents, memory persistence, recursive self-audit, 81-test pytest suite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "rich>=13",
    "pydantic>=2",
    "click>=8",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3"]

[project.scripts]
black-heron = "black_heron.cli:audit"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
